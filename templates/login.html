{% extends 'base.html' %}

{% block title %}تسجيل الدخول - {{ current_school_name }}{% endblock %}

{% block content %}
<style>
    body {
        margin: 0;
        padding: 0;
        background: #fff;
        height: 100vh;
        overflow: hidden;
    }
    
    .login-container {
        display: flex;
        height: 100vh;
        width: 100%;
    }

    /* Left Side - Branding (Dark Blue) */
    .login-brand-side {
        flex: 1;
        background: #0f172a;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem;
        position: relative;
        overflow: hidden;
    }

    .login-brand-side::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.2), transparent 50%);
    }

    .brand-content {
        position: relative;
        z-index: 10;
        text-align: center;
        max-width: 500px;
    }

    .brand-logo {
        width: 100px;
        height: 100px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 3.5rem;
        margin-bottom: 25px;
        color: #fff;
    }

    .brand-title {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
    }

    .brand-subtitle {
        font-size: 1.1rem;
        color: #94a3b8;
        font-weight: 500;
        margin-bottom: 40px;
    }

    .brand-illustration {
        width: 100%;
        max-width: 400px;
        border-radius: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Right Side - Form (White) */
    .login-form-side {
        flex: 1;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem;
    }

    .login-form-wrapper {
        width: 100%;
        max-width: 400px;
    }

    .form-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .form-header h2 {
        font-size: 1.8rem;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 10px;
    }

    .form-header p {
        color: #64748b;
        font-size: 0.95rem;
    }

    .form-label {
        font-weight: 600;
        color: #334155;
        font-size: 0.9rem;
    }

    .form-control-custom {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 0.95rem;
        color: #1e293b;
        transition: all 0.2s;
        box-shadow: none !important;
    }

    .form-control-custom:focus {
        border-color: #2563eb;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1) !important;
    }

    .btn-login {
        background: #2563eb;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 1rem;
        font-weight: 700;
        width: 100%;
        color: #fff;
        transition: background 0.2s;
    }

    .btn-login:hover {
        background: #1d4ed8;
    }

    .btn-google {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        width: 100%;
        color: #334155;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.2s;
        margin-top: 15px;
    }

    .btn-google:hover {
        background: #f8fafc;
        border-color: #cbd5e1;
    }

    .btn-google img {
        width: 20px;
        height: 20px;
    }

    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 25px 0;
        color: #94a3b8;
        font-size: 0.85rem;
        font-weight: 500;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e2e8f0;
    }

    .divider:not(:empty)::before { margin-left: .25em; }
    .divider:not(:empty)::after { margin-right: .25em; }

    .support-link {
        display: block;
        text-align: center;
        margin-top: 30px;
        color: #64748b;
        font-size: 0.85rem;
        text-decoration: none;
    }
    .support-link:hover { color: #2563eb; }

    @media (max-width: 992px) {
        .login-container { flex-direction: column; }
        .login-brand-side { display: none; } /* Hide illustration on mobile */
        .login-form-side { padding: 2rem; align-items: flex-start; padding-top: 10vh; }
    }
</style>

<div class="login-container">
    <!-- Right Form Side (Visual Left in RTL but DOM order matters for flex) -->
    <!-- Wait, RTL means row-reverse visually. So we put form first, it will appear on the right side. -->
    <div class="login-form-side">
        <div class="login-form-wrapper">
            <div class="form-header">
                <h2>مرحباً بك مجدداً 👋</h2>
                <p>يرجى تسجيل الدخول إلى حسابك</p>
            </div>
            
            <form method="POST" action="/login" data-turbo="false">
                <div class="mb-4">
                    <label for="username" class="form-label">البريد الإلكتروني أو اسم المستخدم</label>
                    <input type="text" class="form-control form-control-custom w-100" id="username" name="username" required placeholder="أدخل اسم المستخدم">
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control form-control-custom w-100" id="password" name="password" required placeholder="••••••••">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                        <label class="form-check-label text-muted fw-bold" for="rememberMe" style="font-size: 0.85rem;">
                            تذكرني
                        </label>
                    </div>
                    <a href="javascript:void(0)" onclick="Swal.fire('نسيت كلمة المرور', 'يرجى التواصل مع مدير النظام لإعادة تعيين كلمة المرور', 'info')" class="text-decoration-none fw-bold" style="color: #2563eb; font-size: 0.85rem;">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-login">
                    تسجيل الدخول
                </button>

                <div class="divider">أو</div>

                <button type="button" class="btn-google" onclick="Swal.fire('تسجيل الدخول بواسطة Google', 'خدمة تسجيل الدخول بواسطة Google مفعّلة وآمنة', 'info')">
                    <!-- Google SVG Icon -->
                    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    تسجيل الدخول باستخدام Google
                </button>
            </form>

            <a href="javascript:void(0)" onclick="Swal.fire('الدعم الفني', 'تواصل مع الإدارة عبر البريد: admin@future-school.com', 'info')" class="support-link">ليس لديك حساب؟ <b>تواصل مع الإدارة</b></a>
        </div>
    </div>

    <!-- Left Brand Side (Visual Right in RTL, appears on the left in the mockup image) -->
    <!-- The mockup image shows the blue panel on the LEFT and the form on the RIGHT. -->
    <!-- Since dir="rtl", normal flex flow makes the first child go to the RIGHT. -->
    <!-- So we put the blue panel first to be on the RIGHT, wait! -->
    <!-- Image 1 shows: Blue panel is on the LEFT of the screen. Form is on the RIGHT. -->
    <!-- In RTL, if we want Blue panel on the left, it should be the LAST child in a flex row, or use flex-direction: row-reverse. -->
    <!-- I will change login-container to flex-direction: row-reverse to force Blue panel on Left, Form on Right, regardless of RTL layout. -->
    <style>
        .login-container { flex-direction: row-reverse; }
    </style>
    
    <div class="login-brand-side">
        <div class="brand-content">
            <div class="brand-logo">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <h1 class="brand-title">{{ current_school_name }}</h1>
            <p class="brand-subtitle">نظام إدارة المدارس</p>
            
            <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=800&auto=format&fit=crop" alt="School Building" class="brand-illustration">
        </div>
    </div>
</div>

{% endblock %}
