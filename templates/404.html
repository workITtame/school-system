{% extends 'base.html' %}

{% block title %}404 - الصفحة غير موجودة{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center min-vh-100 bg-white text-center p-4">
    <div class="mb-4 position-relative">
        <h1 style="font-size: 8rem; font-weight: 900; color: #2563eb; letter-spacing: -2px; line-height: 1;">404</h1>
        <div class="position-absolute top-50 start-50 translate-middle opacity-10">
            <i class="fa-solid fa-ghost" style="font-size: 14rem; color: #2563eb;"></i>
        </div>
    </div>
    
    <h3 class="fw-bold text-dark mb-2">404 - عذراً، الصفحة التي تبحث عنها غير موجودة</h3>
    <p class="text-muted mb-4" style="max-width: 450px;">قد تكون الصفحة قد تم نقلها أو حذفها، أو أن الرابط الذي ادخلته غير صحيح.</p>
    
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow">
        <i class="fa-solid fa-house me-2"></i> العودة إلى الصفحة الرئيسية
    </a>
</div>
{% endblock %}
